<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flatmates | Find a perfect house for you</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eef2f7;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#222;
}

#loading{
    text-align:center;
    font-size:20px;
    margin:30px;
    color:#555;
}

.property-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:25px;
}

.card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.image{
    width:100%;
    height:220px;
    object-fit:cover;
}

.no-image{
    height:220px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ddd;
    color:#555;
    font-size:22px;
}

.content{
    padding:20px;
}

.address{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

.price{
    font-size:28px;
    color:#0d6efd;
    font-weight:bold;
    margin-bottom:15px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.item{
    background:#f7f7f7;
    padding:10px;
    border-radius:8px;
}

.item h4{
    color:#666;
    margin-bottom:5px;
    font-size:14px;
}

.item p{
    font-size:16px;
    font-weight:bold;
}

.status{
    margin-top:20px;
    padding:10px;
    text-align:center;
    border-radius:8px;
    color:#fff;
    font-weight:bold;
}

.active{
    background:#28a745;
}

.inactive{
    background:#dc3545;
}
/* Header */

.navbar{
    width:100%;
    background:#ffffff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 40px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:35px;
    border-radius:12px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#0d6efd;
    cursor:pointer;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-size:17px;
    font-weight:600;
    transition:.3s;
}

nav a:hover{
    color:#0d6efd;
}

.auth-links{
    display:flex;
    gap:15px;
}

.auth-links button{
    padding:10px 22px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.3s;
}

.login-btn{
    background:white;
    border:2px solid #0d6efd !important;
    color:#0d6efd;
}

.login-btn:hover{
    background:#0d6efd;
    color:white;
}

.register-btn{
    background:#0d6efd;
    color:white;
}

.register-btn:hover{
    background:#084dbd;
}

/* Mobile */

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        gap:20px;
        padding:20px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
        gap:18px;
    }

    .auth-links{
        width:100%;
        justify-content:center;
    }

}
</style>

</head>
<body>
<header class="navbar">
    <div class="logo">
        🏠 Flatmates
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="properties.html">Properties</a>
        <a href="about.html">About</a>
    </nav>

    <div class="auth-links">
    <a href="login.html" class="login-btn">Sign In</a>
    <a href="register.html" class="register-btn">Register</a>
</div>
</header>
<h1>🏠 Available Properties</h1>

<div id="loading">Loading Properties...</div>

<div id="propertyContainer" class="property-grid"></div>

<script>

const API_URL = "http://localhost:4000/properties/property";

async function fetchProperty(){

    const loading=document.getElementById("loading");
    const container=document.getElementById("propertyContainer");

    try{

        const response=await fetch(API_URL);

        if(!response.ok){
            throw new Error("Failed to fetch properties");
        }

        const res=await response.json();

        console.log(res);

        const properties=res.Property;

        loading.style.display="none";

        container.innerHTML="";

        properties.forEach(property=>{

            const card=document.createElement("div");
            card.className="card";

            let imageHTML="";

            if(property.images && property.images.length>0){

                imageHTML=`
                    <img class="image"
                    src="${property.images[0]}"
                    alt="Property Image">
                `;

            }else{

                imageHTML=`
                    <div class="no-image">
                        No Image Available
                    </div>
                `;

            }

            card.innerHTML=`

                ${imageHTML}

                <div class="content">

                    <div class="address">
                        📍 ${property.address}
                    </div>

                    <div class="price">
                        ₹${property.price}/month
                    </div>

                    <div class="info">

                        <div class="item">
                            <h4>Type</h4>
                            <p>${property.type}</p>
                        </div>

                        <div class="item">
                            <h4>BHK</h4>
                            <p>${property.bhk}</p>
                        </div>

                        <div class="item">
                            <h4>Bedrooms</h4>
                            <p>${property.bedrooms}</p>
                        </div>

                        <div class="item">
                            <h4>Bathrooms</h4>
                            <p>${property.bathroom}</p>
                        </div>

                        <div class="item">
                            <h4>Furnishing</h4>
                            <p>${property.furnishingStatus}</p>
                        </div>

                        <div class="item">
                            <h4>Listed By</h4>
                            <p>${property.brokerName}</p>
                        </div>

                    </div>

                    <div class="status ${property.status}">
                        ${property.status.toUpperCase()}
                    </div>

                </div>

            `;

            container.appendChild(card);

        });

    }catch(error){

        loading.innerHTML=`
            <span style="color:red;">
                ${error.message}
            </span>
        `;

    }

}

fetchProperty();

</script>

</body>
</html>
