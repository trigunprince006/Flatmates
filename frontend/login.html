<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Flatmates - Sign In</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./stylesheets/login.css" />
  </head>

  <body>
    <div class="container">
      <div class="logo">
        <h1>Flatmates</h1>
        <p>Welcome Back 👋</p>
      </div>

      <div class="card">
        <h2>Sign In</h2>

        <p class="subtitle">Login using your registered phone number.</p>

        <div id="phoneSection">
          <div class="input-group">
            <label>Phone Number</label>

            <input
              type="tel"
              id="phone"
              placeholder="Enter phone number"
              maxlength="10"
            />
          </div>

          <button class="primary" id="sendBtn" onclick="sendOTP()">
            Send OTP
          </button>
        </div>

        <div id="otpSection">
          <div class="input-group">
            <label>OTP</label>

            <input type="text" id="otp" maxlength="6" placeholder="Enter OTP" />
          </div>

          <button class="primary" id="loginBtn" onclick="loginUser()">
            Login
          </button>

          <button class="secondary" onclick="sendOTP()" id="resendBtn" disabled>
            Resend OTP
          </button>

          <div class="timer">
            Resend OTP in
            <span id="countdown">30</span>s
          </div>
        </div>

        <div id="message"></div>

        <div class="bottom">
          Not registered yet?

          <a href="register.html"> Register Here </a>
        </div>
        <div>
          Logging as broker
          <a href="./broker/brokerlogin.html">Broker login</a>
        </div>
      </div>
    </div>
    <script src="./scripts/login.js"></script>
  </body>
</html>
