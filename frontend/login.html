<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Flatmates - Sign In</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #4f46e5, #2563eb, #06b6d4);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 420px;
      }

      .logo {
        text-align: center;
        margin-bottom: 25px;
        color: white;
      }

      .logo h1 {
        font-size: 38px;
      }

      .logo p {
        opacity: 0.9;
      }

      .card {
        background: white;
        border-radius: 20px;
        padding: 35px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
        font-size: 14px;
      }

      .input-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        transition: 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #4f46e5;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }

      .primary {
        background: #4f46e5;
        color: white;
      }

      .primary:hover {
        background: #4338ca;
      }

      .secondary {
        background: #f1f5f9;
        color: #333;
        margin-top: 12px;
      }

      .secondary:hover {
        background: #e2e8f0;
      }

      #otpSection {
        display: none;
      }

      #message {
        margin-top: 18px;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
      }

      .success {
        color: green;
      }

      .error {
        color: red;
      }

      .bottom {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
      }

      .bottom a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 600;
      }

      .bottom a:hover {
        text-decoration: underline;
      }

      .timer {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        color: #666;
      }

      .loader {
        display: none;
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="logo">
        <h1>Flatmates</h1>
        <p>Welcome Back 👋</p>
      </div>

      <div class="card">
        <h2>Sign In</h2>

        <p class="subtitle">Login using your registered phone number.</p>

        <div id="phoneSection">
          <div class="input-group">
            <label>Phone Number</label>

            <input
              type="tel"
              id="phone"
              placeholder="Enter phone number"
              maxlength="10"
            />
          </div>

          <button class="primary" id="sendBtn" onclick="sendOTP()">
            Send OTP
          </button>
        </div>

        <div id="otpSection">
          <div class="input-group">
            <label>OTP</label>

            <input type="text" id="otp" maxlength="6" placeholder="Enter OTP" />
          </div>

          <button class="primary" id="loginBtn" onclick="loginUser()">
            Login
          </button>

          <button class="secondary" onclick="sendOTP()" id="resendBtn" disabled>
            Resend OTP
          </button>

          <div class="timer">
            Resend OTP in
            <span id="countdown">30</span>s
          </div>
        </div>

        <div id="message"></div>

        <div class="bottom">
          Not registered yet?

          <a href="register.html"> Register Here </a>
        </div>
        <div>
          Logging as broker
          <a href="./broker/brokerlogin.html">Broker login</a>
        </div>
      </div>
    </div>

    <script>
      const BASE_URL = "http://localhost:4000/auth";

      let timer = 30;
      let interval;

      function showMessage(msg, type) {
        const m = document.getElementById("message");

        m.innerHTML = msg;

        m.className = type;
      }

      async function sendOTP() {
        const phone = document.getElementById("phone").value.trim();

        if (phone.length !== 10) {
          showMessage("Enter a valid phone number.", "error");

          return;
        }

        const btn = document.getElementById("sendBtn");
        const resend = document.getElementById("resendBtn");

        btn.disabled = true;
        btn.innerHTML = "Sending...";

        try {
          const response = await fetch(`${BASE_URL}/send-otp`, {
            method: "POST",
            // credentials: "include",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              phoneNumber: phone,
            }),
          });

          const data = await response.json();
          console.log(data)
          if (response.ok) {
            showMessage("OTP sent successfully.", "success");
            btn.style.display = "none";
            document.getElementById("otpSection").style.display = "block";
            

            startTimer();
          } else {
            showMessage(data.message || "Failed to send OTP", "error");
          }
        } catch (err) {
          showMessage("Server Error", "error");
        }

        btn.disabled  = false;
        btn.innerHTML = "Send OTP";
      }

      function startTimer() {
        timer = 30;

        const resend = document.getElementById("resendBtn");

        resend.disabled = true;

        document.getElementById("countdown").innerHTML = timer;

        clearInterval(interval);

        interval = setInterval(() => {
          timer--;

          document.getElementById("countdown").innerHTML = timer;

          if (timer <= 0) {
            clearInterval(interval);

            resend.disabled = false;

            document.querySelector(".timer").innerHTML =
              "You can resend OTP now.";
          }
        }, 1000);
      }

      async function loginUser() {
        const phone = document.getElementById("phone").value.trim();

        const otp = document.getElementById("otp").value.trim();

        if (otp.length !== 4) {
          showMessage("Enter valid OTP.", "error");

          return;
        }

        const btn = document.getElementById("loginBtn");

        btn.disabled = true;
        btn.innerHTML = "Logging In...";

        try {
          const response = await fetch(`${BASE_URL}/login`, {
            method: "POST",
            credentials: "include",   // <-- ADD THIS
            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              phoneNumber: phone,
              otp: otp,
            }),
          });

          const data = await response.json();
          console.log(data)
          if (response.ok) {
            showMessage("Login Successful 🎉", "success");
// Save token if returned

        // localStorage.setItem("token",data.token);

// Redirect

        window.location.href="./user/dashboard.html";
            console.log(data);
          } else {
            showMessage(data.message || "Invalid OTP", "error");
          }
        } catch (err) {
          showMessage("Server Error", "error");
        }

        btn.disabled = false;

        btn.innerHTML = "Login";
      }
    </script>
  </body>
</html>
