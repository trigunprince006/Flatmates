<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broker Registration</title>
    <link rel="stylesheet" href="../stylesheets/broker/broker-register.css" />
  </head>
  <body>
    <div class="container">
      <h2>Broker Register</h2>

      <input type="text" id="fullname" placeholder="Full Name" />

      <input type="email" id="email" placeholder="Email" />

      <input type="password" id="password" placeholder="Password" />

      <input type="text" id="phone" placeholder="Phone Number" />

      <button id="sendOtpBtn">Send OTP</button>

      <input type="text" id="otp" placeholder="Enter OTP" />

      <button id="verifyOtpBtn">Verify OTP</button>

      <button id="registerBtn">Register Broker</button>

      <p class="message" id="msg"></p>
    </div>
    <script src="../scripts/broker/broker-register.js"></script>
  </body>
</html>
