<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Property</title>
    <link rel="stylesheet" href="../stylesheets/broker/list-property.css" />
  </head>
  <body>
    <div class="container">
      <h2>List New Property</h2>

      <form id="propertyForm">
        <div class="form-group">
          <label>Property Address</label>
          <input type="text" name="address" required />
        </div>

        <div class="form-group">
          <label>BHK</label>
          <input type="number" name="bhk" required />
        </div>

        <div class="form-group">
          <label>Price</label>
          <input type="number" name="price" required />
        </div>

        <div class="form-group">
          <label>Bedrooms</label>
          <input type="number" name="bedrooms" required />
        </div>

        <div class="form-group">
          <label>Bathrooms</label>
          <input type="number" name="bathroom" required />
        </div>

        <div class="form-group">
          <label>Furnishing Status</label>

          <select name="furnishingStatus">
            <option value="Furnished">Furnished</option>
            <option value="Semi-furnished">Semi-furnished</option>
            <option value="Unfurnished">Unfurnished</option>
          </select>
        </div>

        <div class="form-group">
          <label>Property Type</label>

          <select name="type">
            <option value="Apartment">Apartment</option>
            <option value="Independent-House">Independent House</option>
            <option value="Villa">Villa</option>
            <option value="PG">PG</option>
            <option value="Hostel">Hostel</option>
          </select>
        </div>

        <div class="form-group">
          <label>Property Images</label>
          <input type="file" name="images" multiple accept="image/*" />
        </div>

        <button id="submitBtn">List Property</button>
      </form>

      <div id="message"></div>
    </div>
    <script src="../scripts//broker/list-property.js"></script>
  </body>
</html>
