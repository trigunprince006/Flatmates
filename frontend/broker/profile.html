<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broker Profile</title>

    <link rel="stylesheet" href="../stylesheets/broker/profile.css" />
  </head>
  <body>
    <div class="container">
      <div class="profile-card">
        <div class="header">
          <img
            id="profileImage"
            src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
          />

          <div>
            <h2 id="fullname">Loading...</h2>
            <!-- <p id="occupation"></p> -->
          </div>
        </div>

        <div class="info">
          <div class="box">
            <!-- <label>Relationship Status</label>
            <span id="relationship">-</span> -->
          </div>

          <div class="box">
            <label>Email</label>
            <span id="email">-</span>
          </div>

          <div class="box">
            <label>Contact</label>
            <span id="contact">-</span>
          </div>
        </div>
      </div>

      <div class="password-card">
        <h3>Change Password</h3>

        <input
          type="password"
          id="oldPassword"
          placeholder="Current Password"
        />

        <input type="password" id="newPassword" placeholder="New Password" />

        <button onclick="changePassword()">Change Password</button>

        <p id="message"></p>
      </div>
    </div>

    <script src="../scripts/broker/profile.js"></script>
  </body>
</html>
