<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Flatmates Dashboard</title>
    <link rel="stylesheet" href="../stylesheets/broker/dashboard.css" />
  </head>

  <body>
    <header>
      <div class="logo">🏠 Flatmates</div>

      <div class="profile">
        <div class="notification">🔔</div>

        <span id="username">Guest</span>

        <img src="./assets/user.png" alt="" id="image" />
      </div>
    </header>

    <div class="sidebar">
      <a href="list-property.html">➕ Post Property</a>

      <a href="my-listed-property.html">📄 My Listings</a>

      <a href="#">💬 Messages</a>

      <a href="profile.html">👤 Profile</a>

      <div class="welcome">
        <h2>Welcome Back 👋</h2>

        <p>Find roommates, manage your listings and explore new properties.</p>

      <div class="cards">

        <div class="card">
          <h1>00</h1>

      <div class="actions">
        <!-- <button onclick="searchRoom()">Search Room</button>

        <button onclick="postProperty()">Post Property</button>

        <button onclick="myListings()">My Listings</button>
      </div> -->

        <h2 class="section-title">Recent Properties</h2>

        <div id="pagination" class="pagination"></div>
      </div>
    </div>
    <script src="../scripts/broker/dashboard.js"></script>
