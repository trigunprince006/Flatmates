<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broker Login</title>
    <link
      rel="stylesheet"
      href="../stylesheets/broker/broker-login.className"
    />
  </head>
  <body>
    <div class="container">
      <h2>Broker Login</h2>

      <div class="input-group">
        <label>Phone Number</label>
        <input type="number" id="loginPhone" placeholder="Enter Phone Number" />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Enter Password"
        />
      </div>

      <button id="loginBtn">Login</button>

      <div class="forgot">
        <a id="forgotPasswordBtn">Forgot Password?</a>
      </div>

      <div id="loginMessage" class="message"></div>
    </div>

    <!-- Forgot Password Modal -->

    <div class="modal" id="forgotModal">
      <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>

        <h3>Reset Password</h3>

        <div class="input-group">
          <label>Phone Number</label>
          <input type="number" id="resetPhone" placeholder="Phone Number" />
        </div>

        <button id="sendOtpBtn">Generate OTP</button>

        <br /><br />

        <div class="input-group">
          <label>OTP</label>
          <input type="text" id="otp" placeholder="Enter OTP" />
        </div>

        <div class="input-group">
          <label>New Password</label>
          <input type="password" id="newPassword" placeholder="New Password" />
        </div>

        <button id="resetBtn">Reset Password</button>

        <div id="resetMessage" class="message"></div>
      </div>
    </div>
    <script src="../scripts/broker/broker-login.js"></script>
  </body>
</html>
