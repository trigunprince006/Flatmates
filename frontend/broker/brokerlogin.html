<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broker Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.forgot{
    text-align:right;
    margin-top:10px;
}

.forgot a{
    color:#007bff;
    cursor:pointer;
    text-decoration:none;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

/* Modal */

.modal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
}

.modal-content{
    width:420px;
    background:white;
    border-radius:12px;
    padding:30px;
}

.close{
    float:right;
    cursor:pointer;
    font-size:24px;
}

.modal h3{
    margin-bottom:20px;
}
</style>

</head>
<body>

<div class="container">

<h2>Broker Login</h2>

<div class="input-group">
<label>Phone Number</label>
<input
type="number"
id="loginPhone"
placeholder="Enter Phone Number">
</div>

<div class="input-group">
<label>Password</label>
<input
type="password"
id="loginPassword"
placeholder="Enter Password">
</div>

<button id="loginBtn">
Login
</button>

<div class="forgot">
<a id="forgotPasswordBtn">Forgot Password?</a>
</div>

<div id="loginMessage" class="message"></div>

</div>


<!-- Forgot Password Modal -->

<div class="modal" id="forgotModal">

<div class="modal-content">

<span class="close" id="closeModal">&times;</span>

<h3>Reset Password</h3>

<div class="input-group">
<label>Phone Number</label>
<input
type="number"
id="resetPhone"
placeholder="Phone Number">
</div>

<button id="sendOtpBtn">
Generate OTP
</button>

<br><br>

<div class="input-group">
<label>OTP</label>
<input
type="text"
id="otp"
placeholder="Enter OTP">
</div>

<div class="input-group">
<label>New Password</label>
<input
type="password"
id="newPassword"
placeholder="New Password">
</div>

<button id="resetBtn">
Reset Password
</button>

<div id="resetMessage" class="message"></div>

</div>

</div>

<script>

const loginMessage=document.getElementById("loginMessage");
const resetMessage=document.getElementById("resetMessage");

const forgotModal=document.getElementById("forgotModal");

document.getElementById("forgotPasswordBtn").onclick=()=>{
    forgotModal.style.display="flex";
}

document.getElementById("closeModal").onclick=()=>{
    forgotModal.style.display="none";
}

window.onclick=(e)=>{
    if(e.target==forgotModal){
        forgotModal.style.display="none";
    }
}


// LOGIN

document.getElementById("loginBtn").onclick=async()=>{

    const btn=document.getElementById("loginBtn");

    btn.disabled=true;
    btn.innerText="Logging In...";

    loginMessage.innerHTML="";

    const phoneNumber=document.getElementById("loginPhone").value.trim();

    const password=document.getElementById("loginPassword").value.trim();

    try{

        const response=await fetch("http://localhost:4000/broker/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                phoneNumber:Number(phoneNumber),
                password
            })

        });

        const data=await response.json();

        if(response.ok){

            loginMessage.className="message success";
            loginMessage.innerHTML="Login Successful";

            console.log(data);

            window.location.href="dashboard.html";

        }else{

            loginMessage.className="message error";
            loginMessage.innerHTML=data.message || "Login Failed";

        }

    }

    catch(err){

        loginMessage.className="message error";
        loginMessage.innerHTML="Server Error";

    }

    btn.disabled=false;
    btn.innerText="Login";

}



// SEND OTP

document.getElementById("sendOtpBtn").onclick=async()=>{

    const btn=document.getElementById("sendOtpBtn");

    btn.disabled=true;

    btn.innerText="Sending...";

    resetMessage.innerHTML="";

    const phoneNumber=document.getElementById("resetPhone").value.trim();

    try{

        const response=await fetch("http://localhost:4000/broker/send-otp-reset-password",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                phoneNumber:Number(phoneNumber)

            })

        });

        const data=await response.json();

        if(response.ok){

            resetMessage.className="message success";
            resetMessage.innerHTML="OTP Sent Successfully";

        }else{

            resetMessage.className="message error";
            resetMessage.innerHTML=data.message || "Unable to Send OTP";

        }

    }

    catch(err){

        resetMessage.className="message error";
        resetMessage.innerHTML="Server Error";

    }

    btn.disabled=false;
    btn.innerText="Generate OTP";

}



// RESET PASSWORD

document.getElementById("resetBtn").onclick=async()=>{

    const btn=document.getElementById("resetBtn");

    btn.disabled=true;

    btn.innerText="Resetting...";

    resetMessage.innerHTML="";

    const phoneNumber=document.getElementById("resetPhone").value.trim();

    const otp=document.getElementById("otp").value.trim();

    const newPassword=document.getElementById("newPassword").value.trim();

    try{

        const response=await fetch("http://localhost:4000/broker/reset-password",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                phoneNumber:Number(phoneNumber),

                otp,

                newPassword

            })

        });

        const data=await response.json();

        if(response.ok){

            resetMessage.className="message success";
            resetMessage.innerHTML="Password Reset Successfully";

        }else{

            resetMessage.className="message error";
            resetMessage.innerHTML=data.message || "Reset Failed";

        }

    }

    catch(err){

        resetMessage.className="message error";
        resetMessage.innerHTML="Server Error";

    }

    btn.disabled=false;
    btn.innerText="Reset Password";

}

</script>

</body>
</html>
