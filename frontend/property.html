<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
            padding:30px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        img{
            width:100%;
            height:400px;
            object-fit:cover;
            border-radius:10px;
            margin-bottom:20px;
        }

        h1{
            margin-bottom:10px;
        }

        .price{
            color:green;
            font-size:24px;
            margin:10px 0;
            font-weight:bold;
        }

        .box{
            margin:12px 0;
        }

        .label{
            font-weight:bold;
        }

        button{
            padding:10px 20px;
            border:none;
            background:#007bff;
            color:white;
            cursor:pointer;
            border-radius:5px;
            margin-top:20px;
        }

        button:hover{
            background:#0056b3;
        }
        #brokerBox{
          border:1px solid blue ;
          display: inline-block;
          padding: 5px 10px ;
          cursor: pointer;
        }

    </style>

</head>
<body>

<div class="container">

    <button onclick="history.back()">⬅ Back</button>

    <br><br>

    <img id="image" src="" alt="Property Image">

    <h1 id="address">Loading...</h1>

    <div class="price" id="price"></div>

    <div class="box">
        <span class="label">Description:</span>
        <p id="description"></p>
    </div>

    <div class="box">
        <span class="label">Type:</span>
        <span id="type"></span>
    </div>

    <div class="box">
        <span class="label">BHK:</span>
        <span id="bhk"></span>
    </div>

    <div class="box">
        <span class="label">Bedrooms:</span>
        <span id="bedrooms"></span>
    </div>

    <div class="box">
        <span class="label">Bathrooms:</span>
        <span id="bathroom"></span>
    </div>

    <div class="box">
        <span class="label">Furnishing:</span>
        <span id="furnishing"></span>
    </div>

    <div class="box" id="brokerBox">
        <span class="label">Broker:</span>
        <span id="broker"></span>
    </div>

    <div class="box">
        <span class="label">Status:</span>
        <span id="status"></span>
    </div>

</div>

<script>

const propertyId = new URLSearchParams(window.location.search).get("id");

async function loadProperty(){

    try{

        const response = await fetch(`http://localhost:4000/properties/house/id/?id=${propertyId}`);

        if(!response.ok){
            throw new Error("Property not found");
        }

        const res = await response.json();
        const{property} = res;
        console.log(property);

        document.getElementById("image").src =
            property.images.length > 0
            ? property.images[0]
            : "https://via.placeholder.com/800x400?text=No+Image";

        document.getElementById("address").innerText = property.address;

        document.getElementById("price").innerText =
            `₹${property.price}/month`;

        document.getElementById("description").innerText =
            property.description || "No Description";

        document.getElementById("type").innerText =
            property.type;

        document.getElementById("bhk").innerText =
            property.bhk;

        document.getElementById("bedrooms").innerText =
            property.bedrooms;

        document.getElementById("bathroom").innerText =
            property.bathroom;

        document.getElementById("furnishing").innerText =
            property.furnishingStatus;

        document.getElementById("broker").innerText =
            property.brokerName;

        document.getElementById("status").innerText =
            property.status;
     const brokerBox = document.getElementById("brokerBox");

      brokerBox.onclick = () => {
       window.location.href = `broker.html?id=${property.listedBy}`;
   }
    }
    

    catch(error){

        document.body.innerHTML = `<h2>${error.message}</h2>`;

    }

}

loadProperty();


</script>

</body>
</html>
