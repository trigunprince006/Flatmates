<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broker Registration</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:420px;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:6px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:10px;
            cursor:pointer;
            border:none;
            border-radius:6px;
            background:#2563eb;
            color:white;
            font-size:15px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .message{
            margin-top:15px;
            text-align:center;
            font-weight:bold;
        }
    </style>

</head>
<body>

<div class="container">

    <h2>Broker Register</h2>

    <input type="text" id="fullname" placeholder="Full Name">

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <input type="text" id="phone" placeholder="Phone Number">

    <button id="sendOtpBtn">
        Send OTP
    </button>

    <input type="text" id="otp" placeholder="Enter OTP">

    <button id="verifyOtpBtn">
        Verify OTP
    </button>

    <button id="registerBtn">
        Register Broker
    </button>

    <p class="message" id="msg"></p>

</div>

<script>

const msg = document.getElementById("msg");

let otpVerified = false;

const phoneInput = document.getElementById("phone");

document.getElementById("sendOtpBtn").addEventListener("click", async ()=>{

    const phoneNumber = phoneInput.value;
    const fullname = document.getElementById("fullname").value;
    const email = document.getElementById("email").value;
    try{

        const res = await fetch("http://localhost:4000/broker/send-otp",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                fullname,
                email,
                phoneNumber
            })

        });

        const data = await res.json();

        console.log(data);

        msg.innerText = data.message || "OTP Sent";

    }
    catch(err){

        console.error(err);
        msg.innerText = "Failed to send OTP";

    }

});


document.getElementById("verifyOtpBtn").addEventListener("click", async ()=>{

    const phoneNumber = phoneInput.value;

    const otp = document.getElementById("otp").value;

    try{

        const res = await fetch("http://localhost:4000/broker/verify-otp",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                phoneNumber,
                otp
            })

        });

        const data = await res.json();

        console.log(data);

        if(res.ok){

            otpVerified = true;

            msg.innerText = "OTP Verified Successfully";

        }

        else{

            otpVerified = false;

            msg.innerText = data.message || "OTP Verification Failed";

        }

    }

    catch(err){

        console.error(err);

        msg.innerText = "Error verifying OTP";

    }

});


document.getElementById("registerBtn").addEventListener("click", async ()=>{

    if(!otpVerified){

        alert("Please verify OTP first.");

        return;

    }

    const fullname = document.getElementById("fullname").value;

    const email = document.getElementById("email").value;

    const password = document.getElementById("password").value;

    const phoneNumber = Number(document.getElementById("phone").value);

    try{

        const res = await fetch("http://localhost:4000/broker/register",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                fullname,
                email,
                password,
                phoneNumber,

                brokerProfile:{}

            })

        });

        const data = await res.json();

        console.log(data);

        if(res.ok){

            msg.innerText = "Broker Registered Successfully";

        }

        else{

            msg.innerText = data.message || "Registration Failed";

        }

    }

    catch(err){

        console.error(err);

        msg.innerText = "Server Error";

    }

});

</script>

</body>
</html>
