<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #4f46e5, #06b6d4);

        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
      }

      .container {
        width: 1100px;
        height: 650px;
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }

      .left {
        width: 50%;
        background: linear-gradient(160deg, #2563eb, #06b6d4);

        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 40px;
        color: white;
      }

      .left img {
        width: 85%;
        max-width: 420px;
      }

      .left h1 {
        margin-top: 20px;
        font-size: 35px;
      }

      .left p {
        margin-top: 15px;
        text-align: center;
        opacity: 0.9;
      }

      .right {
        width: 50%;
        padding: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .form {
        width: 100%;
      }

      .form h2 {
        font-size: 34px;
        margin-bottom: 5px;
      }

      .form p {
        color: #666;
        margin-bottom: 30px;
      }

      .input-group {
        margin-bottom: 18px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
      }

      .input-group input {
        width: 100%;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        transition: 0.3s;
      }

      .input-group input:focus {
        outline: none;
        border-color: #2563eb;
      }

      button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
      }

      .primary {
        background: #2563eb;
        color: white;
      }

      .primary:hover {
        background: #1d4ed8;
      }

      .secondary {
        background: #10b981;
        color: white;
      }

      .secondary:hover {
        background: #059669;
      }

      .register {
        background: #7c3aed;
        color: white;
      }

      .register:hover {
        background: #6d28d9;
      }

      #otpSection {
        display: none;
      }

      .message {
        margin-top: 15px;
        padding: 12px;
        border-radius: 10px;
        display: none;
      }

      .success {
        background: #dcfce7;
        color: #166534;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
      }

      .login {
        margin-top: 25px;
        text-align: center;
      }

      .login a {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
      }

      .loading {
        opacity: 0.6;
        pointer-events: none;
      }

      
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <img
          src="https://undraw.co/api/illustrations/secure-login.svg"
          onerror="
            this.src =
              'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800'
          "
          alt=""
        />

        <h1>Create Account</h1>

        <p>Register securely with OTP verification.</p>
      </div>

      <div class="right">
        <div class="form">
          <h2>Register</h2>

          <p>Create your account in a few seconds.</p>

          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="fullname" />
          </div>

          <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" />
          </div>

          <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" />
          </div>

          <button class="primary" id="generateBtn">Generate OTP</button>

          <div id="otpSection">
            <div class="input-group" style="margin-top: 20px">
              <label>Enter OTP</label>
              <input type="text" id="otp" />
            </div>

            <button class="secondary" id="verifyBtn">Verify OTP</button>

            <button class="register" id="registerBtn" disabled>Register</button>
          </div>

          <div class="message" id="message"></div>

          <div class="login">
            Already Registered?

            <a href="login.html">Sign In</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API = {
        generateOTP: "http://localhost:4000/auth/generate-otp",

        verifyOTP: "http://localhost:4000/auth/verify-otp",

        register: "http://localhost:4000/auth/register",
      };

      let otpVerified = false;

      const message = document.getElementById("message");

      function showMessage(text, type) {
        message.innerHTML = text;

        message.className = "message " + type;

        message.style.display = "block";
      }

      function setLoading(btn, state) {
        if (state) {
          btn.classList.add("loading");
          btn.innerHTML = "Please Wait...";
        } else {
          btn.classList.remove("loading");
        }
      }

      document.getElementById("generateBtn").onclick = async () => {
        const fullname = document.getElementById("fullname").value.trim();

        const email = document.getElementById("email").value.trim();

        const phoneNumber = document.getElementById("phone").value.trim();

        if (!fullname || !email || !phoneNumber) {
          showMessage("Fill all fields", "error");

          return;
        }

        const btn = document.getElementById("generateBtn");

        setLoading(btn, true);

        try {
          const response = await fetch(API.generateOTP, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              fullname,

              email,

              phoneNumber
            }),
          });

          const data = await response.json();
          console.log(data)
          showMessage(data.message || "OTP Sent Successfully", "success");

          document.getElementById("otpSection").style.display = "block";

          btn.innerHTML = "Resend OTP";

          setLoading(btn, false);
        } catch (e) {
          showMessage("Failed to Generate OTP", "error");

          btn.innerHTML = "Generate OTP";

          setLoading(btn, false);
        }
      };

      document.getElementById("verifyBtn").onclick = async () => {
        const phoneNumber = document.getElementById("phone").value;

        const otp = document.getElementById("otp").value.toString(); ;

        if (!otp) {
          showMessage("Enter OTP", "error");

          return;
        }

        const btn = document.getElementById("verifyBtn");

        setLoading(btn, true);

        try {
          const response = await fetch(API.verifyOTP, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              phoneNumber,
              otp
            }),
          });

          const data = await response.json();
          console.log(data)
          console.log(document.getElementById("registerBtn").disabled);
          if (data.message) {
            otpVerified = true;
            if(otpVerified){
              btn.disabled = true;
            }
            document.getElementById("registerBtn").disabled = false;
            console.log(document.getElementById("registerBtn").disabled);
            
            showMessage("OTP Verified Successfully", "success");
          } else {
            showMessage(data.message, "error");
          }

          btn.innerHTML = "Verify OTP";

          setLoading(btn, false);
        } catch (e) {
          showMessage("OTP Verification Failed", "error");

          btn.innerHTML = "Verify OTP";

          setLoading(btn, false);
        }
      };

      document.getElementById("registerBtn").onclick = async () => {
        console.log("Register btn is working")
        if (!otpVerified) {
          showMessage("Verify OTP First", "error");

          return;
        }

        const fullname = document.getElementById("fullname").value;

        const email = document.getElementById("email").value;

        const phoneNumber = document.getElementById("phone").value;

        const btn = document.getElementById("registerBtn");

        setLoading(btn, true);

        try {
          const response = await fetch(API.register, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              fullname,

              email,

              phoneNumber
            }),
          });

          const data = await response.json();
          console.log(data)
          showMessage(data.message || "Registration Successful", "success");

          btn.innerHTML = "Registered";
        } catch (e) {
          showMessage("Registration Failed", "error");

          btn.innerHTML = "Register";

          setLoading(btn, false);
        }
      };
    </script>
  </body>
</html>
