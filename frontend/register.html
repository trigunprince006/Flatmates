<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: linear-gradient(135deg, #4f46e5, #06b6d4);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.container {
  width: 1100px;
  max-width: 100%;
  min-height: 650px;
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.left {
  flex: 1;
  background: linear-gradient(160deg, #2563eb, #06b6d4);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 50px;
  color: white;
}

.left img {
  width: 100%;
  max-width: 420px;
}

.left h1 {
  margin-top: 25px;
  font-size: 34px;
}

.left p {
  margin-top: 12px;
  text-align: center;
  opacity: .9;
}

.right {
  flex: 1;
  padding: 45px;
  overflow-y: auto;

  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.form {
  width: 100%;
  max-width: 420px;
}

.form h2 {
  font-size: 34px;
  margin-bottom: 6px;
}

.form p {
  color: #666;
  margin-bottom: 28px;
}

.input-group {
  margin-bottom: 18px;
}

.input-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
}

.input-group input {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  transition: .3s;
}

.input-group input:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 8px rgba(37, 99, 235, .15);
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
  transition: .3s;
}

button:hover {
  transform: translateY(-2px);
}

button:disabled {
  cursor: not-allowed;
  opacity: .6;
  transform: none;
}

.primary {
  background: #2563eb;
  color: white;
}

.primary:hover {
  background: #1d4ed8;
}

.secondary {
  background: #10b981;
  color: white;
}

.secondary:hover {
  background: #059669;
}

.register {
  background: #7c3aed;
  color: white;
}

.register:hover {
  background: #6d28d9;
}

#otpSection {
  display: none;
  animation: fade .4s ease;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message {
  width: 100%;
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  font-weight: 500;
  word-break: break-word;
  animation: fade .3s ease;
}

.success {
  background: #dcfce7;
  color: #166534;
  border-left: 5px solid #16a34a;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  border-left: 5px solid #dc2626;
}

.loading {
  pointer-events: none;
  opacity: .7;
}

.login {
  margin-top: 25px;
  text-align: center;
}

.login a {
  color: #2563eb;
  font-weight: 600;
  text-decoration: none;
}

.login a:hover {
  text-decoration: underline;
}

::-webkit-scrollbar {
  width: 7px;
}

::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 20px;
}

@media (max-width: 900px) {

  .container {
    flex-direction: column;
    min-height: auto;
  }

  .left {
    padding: 35px;
  }

  .left img {
    max-width: 260px;
  }

  .right {
    padding: 30px;
  }

}

@media (max-width: 500px) {

  body {
    padding: 10px;
  }

  .left {
    padding: 25px;
  }

  .right {
    padding: 20px;
  }

  .form h2 {
    font-size: 28px;
  }

  button {
    font-size: 15px;
  }

}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <img
          src="https://undraw.co/api/illustrations/secure-login.svg"
          onerror="
            this.src =
              'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800'
          "
          alt=""
        />

        <h1>Create Account</h1>

        <p>Register securely with OTP verification.</p>
      </div>

      <div class="right">
        <div class="form">
          <h2>Register</h2>

          <p>Create your account in a few seconds.</p>

          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="fullname" />
          </div>

          <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" />
          </div>

          <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" />
          </div>

          <button class="primary" id="generateBtn">Generate OTP</button>

          <div id="otpSection">
            <div class="input-group" style="margin-top: 20px">
              <label>Enter OTP</label>
              <input type="text" id="otp" />
            </div>

            <button class="secondary" id="verifyBtn">Verify OTP</button>

            <button class="register" id="registerBtn" disabled>Register</button>
          </div>

          <div class="message" id="message"></div>

          <div class="login">
            Already Registered?

            <a href="login.html">Sign In</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API = {
        generateOTP: "http://localhost:4000/auth/generate-otp",

        verifyOTP: "http://localhost:4000/auth/verify-otp",

        register: "http://localhost:4000/auth/register",
      };

      let otpVerified = false;

      const message = document.getElementById("message");

     function showMessage(text, type = "success") {
    const message = document.getElementById("message");

    message.textContent = text;
    message.className = `message ${type}`;
    message.style.display = "block";

    clearTimeout(message.timer);

    message.timer = setTimeout(() => {
        message.style.display = "none";
    }, 5000);
}
      function setLoading(btn, state) {
        if (state) {
          btn.classList.add("loading");
          btn.innerHTML = "Please Wait...";
        } else {
          btn.classList.remove("loading");
        }
      }

      document.getElementById("generateBtn").onclick = async () => {
        const fullname = document.getElementById("fullname").value.trim();

        const email = document.getElementById("email").value.trim();

        const phoneNumber = document.getElementById("phone").value.trim();

        if (!fullname || !email || !phoneNumber) {
          showMessage("Fill all fields", "error");

          return;
        }

        const btn = document.getElementById("generateBtn");

        setLoading(btn, true);

        try {
          const response = await fetch(API.generateOTP, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              fullname,

              email,

              phoneNumber
            }),
          });

          const data = await response.json();
          console.log(data)
          showMessage(data.message || "OTP Sent Successfully", "success");

          document.getElementById("otpSection").style.display = "block";

          btn.innerHTML = "Resend OTP";

          setLoading(btn, false);
        } catch (e) {
          showMessage("Failed to Generate OTP", "error");

          btn.innerHTML = "Generate OTP";

          setLoading(btn, false);
        }
      };

      document.getElementById("verifyBtn").onclick = async () => {
        const phoneNumber = document.getElementById("phone").value;

        const otp = document.getElementById("otp").value.toString(); ;

        if (!otp) {
          showMessage("Enter OTP", "error");

          return;
        }

        const btn = document.getElementById("verifyBtn");

        setLoading(btn, true);

        try {
          const response = await fetch(API.verifyOTP, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              phoneNumber,
              otp
            }),
          });

          const data = await response.json();
          console.log(data)
          // console.log(document.getElementById("registerBtn").disabled);
          if (data.message) {
            otpVerified = true;
            if(otpVerified){
              btn.disabled = true;
            }
            document.getElementById("registerBtn").disabled = false;
            console.log(document.getElementById("registerBtn").disabled);
            
            showMessage("OTP Verified Successfully", "success");
          } else {
            showMessage(data.message, "error");
          }

          btn.innerHTML = "Verify OTP";

          setLoading(btn, false);
        } catch (e) {
          showMessage("OTP Verification Failed", "error");

          btn.innerHTML = "Verify OTP";

          setLoading(btn, false);
        }
      };

      document.getElementById("registerBtn").onclick = async () => {
        console.log("Register btn is working")
        if (!otpVerified) {
          showMessage("Verify OTP First", "error");

          return;
        }

        const fullname = document.getElementById("fullname").value;

        const email = document.getElementById("email").value;

        const phoneNumber = document.getElementById("phone").value;

        const btn = document.getElementById("registerBtn");

        setLoading(btn, true);

        try {
          const response = await fetch(API.register, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              fullname,

              email,

              phoneNumber
            }),
          });

          const data = await response.json();
          console.log(data)
          showMessage(data.message || "Registration Successful", "success");
      
          // btn.innerHTML = "Registered";
        window.location.href="login.html";

        } catch (e) {
          showMessage("Registration Failed", "error");

          btn.innerHTML = "Register";

          setLoading(btn, false);
        }
      };
    </script>
  </body>
</html>
