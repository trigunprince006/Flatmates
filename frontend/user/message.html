<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Broker</title>
<link rel="stylesheet" href="../stylesheets/user/message.css">
</head>
<body>

<div class="container">

    <div class="header">

        <img id="profileImage"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKJnygMP2haczLT0OB9W-2G43Ta-wK6AbWTfw2sChr7w&s=10"
        alt="Broker">

        <div class="info">
            <h2 id="brokerName">Loading...</h2>
            <p>Broker</p>
        </div>

    </div>

    <div class="chat" id="chatBox">

        <p style="color:gray;text-align:center">
            Start your conversation.
        </p>

    </div>

    <div class="input-area">

        <input
        type="text"
        id="message"
        placeholder="Type a message...">

        <button id="sendBtn">
            Send
        </button>

    </div>

</div>
<!-- Localhost socket link -->
<script src="http://localhost:4000/socket.io/socket.io.js"></script>
<script src="../scripts/user/message.js"></script>

</body>
</html>
