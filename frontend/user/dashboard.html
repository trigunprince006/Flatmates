<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flatmates Dashboard</title>
    <link rel="stylesheet" href="../stylesheets/user/dashboard.css" />
  </head>

  <body>
    <header>
      <div class="logo">🏠 Flatmates</div>

      <div class="profile">
        <div class="notification">🔔</div>

        <span id="username">Guest</span>

        <img src="./assets/user.png" alt="" id="image" />
      </div>
    </header>

    <div class="sidebar">
      <a href="#">❤️ Wishlist</a>

      <a href="#">💬 Messages</a>

      <a href="profile.html">👤 Profile</a>

      <a href="#" onclick="logout()">🚪 Logout</a>
    </div>

    <div class="main">
      <div class="welcome">
        <h2>Welcome Back 👋</h2>

        <p>Find roommates, manage your listings and explore new properties.</p>
      </div>

      <div class="cards">
        <div class="card">
          <h1>0</h1>
          <p>Messages</p>
        </div>

        <div class="card">
          <h1>00</h1>
          <p>Profile Views</p>
        </div>
      </div>

      <h2 class="section-title">Recent Properties</h2>
      <div id="loading">Loading Properties...</div>
      <div id="propertyContainer" class="property-grid"></div>
      <div id="pagination" class="pagination"></div>
    </div>

    <script src="../scripts/user/dashboard.js"></script>
  </body>
</html>
