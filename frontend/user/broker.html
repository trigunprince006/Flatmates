<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broker Details</title>
    <link rel="stylesheet" href="../stylesheets/user/broker.css" />
  </head>
  <body>
    <div class="container">
      <button onclick="history.back()">⬅ Back</button>

      <div class="profile">
        <img id="photo" src="" alt="Broker" />

        <h2 id="name">Loading...</h2>
      </div>

      <div class="info">
        <div class="item">
          <span>Email :</span>
          <p id="email"></p>
        </div>

        <div class="item">
          <span>Phone :</span>
          <p id="phone"></p>
        </div>

        <div class="item">
          <span>Experience :</span>
          <p id="experience"></p>
        </div>

        <div class="item">
          <span>Agency :</span>
          <p id="agency"></p>
        </div>

        <div class="item">
          <span>Address :</span>
          <p id="address"></p>
        </div>

        <div class="item">
          <span>About :</span>
          <p id="about"></p>
        </div>
      </div>
    </div>
    <script src="../scripts/user/broker.js"></script>
  </body>
</html>
